{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
	<div class="col-md-12">
		<div class="card card-dark">
			<div class="card-header">
				<h3 class="card-title">Monitoring Check</h3>
			</div>
			<div class="card-body">
				<form class="form-horizontal" method="POST" action="/check/monitoring">
					<div class="form-group row">
						<div class="col-sm-3">
							<select name="data" class="form-control" required>
								<option value="">--- Choose Data Sensor ---</option>
								<option value="sensor" {% if data == 'sensor' %}{{ 'selected' }}{% endif %}>All Sensor Data</option>
							</select>
						</div>
						<div class="col-sm-3">
							<select name="protocol" class="form-control" required>
								<option value="">--- Choose Protocol ---</option>
								<option value="HTTP" {% if protocol == 'HTTP' %}{{ 'selected' }}{% endif %}>HTTP</option>
								<option value="MQTT" {% if protocol == 'MQTT' %}{{ 'selected' }}{% endif %}>MQTT</option>
							</select>
						</div>
						<button type="submit" class="btn btn-primary float-right">Run</button>
					</div>
				</form>
                <hr>
				<b>Result</b> <br>
				{% for i in range(result|length) %}
				{{ result[i] }}
				<br>
				{% endfor %}
				<br>
				<hr>
				<a href="/check/monitoring" role="button">
					<button type="button" class="btn btn-default">Refresh</button>
				</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
