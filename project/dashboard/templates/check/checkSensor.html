
{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
    <div class="col-md-12">
        <div class="card card-dark">
            <div class="card-header">
                <h3 class="card-title">Sensor Check</h3>
            </div>
            <div class="card-body">
                <form class="form-horizontal" method="POST" action="/check/sensor">
                    <div class="form-group row">
                        <div class="col-sm-4">
                            <select name="sensor" class="form-control" required>
                                <option value="">--- Choose Sensor ---</option>
                                {% for sensor in sensors %}
                                <option value="{{ sensor['number'] }}" {% if sensor['number']|string == sensor_id|string %} {{ "selected" }} {% endif %}>
                                    {{ sensor['name'] }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary float-right">Run</button>
                    </div>
                </form>
                <b>Result</b> <br>
                {% for res in result %}
                {{ res }}<br>
                {% endfor %}
                <br>
				<font style="color:red">Note : Based on Group Sensor</font>
				<hr>
				<a href="/check/sensor" role="button">
					<button type="button" class="btn btn-default">Refresh</button>
				</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
