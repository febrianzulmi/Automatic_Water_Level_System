{% block sensorTab %}
<div class="tab-pane fade {% if tab == 'sensor' %}{{ 'show active' }}{% endif %}" id="sensor" role="tabpanel"
    aria-labelledby="sensor-tab">
    <ul class="nav nav-tabs" id="custom-tabs-two-tab" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="custom-tabs-two-service-tab" data-toggle="pill"
                href="#custom-tabs-two-service" role="tab" aria-controls="custom-tabs-two-service"
                aria-selected="false">Service</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="custom-tabs-two-sensor-tab" data-toggle="pill" href="#custom-tabs-two-sensor"
                role="tab" aria-controls="custom-tabs-two-sensor" aria-selected="false">Data</a>
        </li>
    </ul>
    <div class="tab-content" id="custom-tabs-two-tabContent">
        <div class="tab-pane fade show active" id="custom-tabs-two-service" role="tabpanel"
            aria-labelledby="custom-tabs-two-service-tab">
            <br>
            <h7 class="mt-4 mb-2"><b>Summary Sensors Service</b></h7><br><br>
            <div id="sensorService"></div>
        </div>
        <div class="tab-pane fade" id="custom-tabs-two-sensor" role="tabpanel"
            aria-labelledby="custom-tabs-two-sensor-tab">
            <br>
            <div id="sensorInfo"></div>
        </div>
    </div>
</div>
{% endblock %}
