{% block check %}
<div class="modal fade" id="modal-sample">
    <div class="modal-dialog">
        <div class="modal-content">
            <form class="form-horizontal" method="POST" action="/calibration/sample">
                <div class="modal-header">
                    <h5 class="modal-title">Add Sample</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Formula Calibrate</label>
                        <div class="col-sm-8">
                            <select name="formula" class="form-control">
                                {% for x in range(formulaData|length) %}
                                <option value="{{ formulaData[x]['id'] }}">{{formulaData[x]['name']}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Sample Value</label>
                        <div class="col-sm-4">
                            <input type="number" class="form-control" name="value_sample">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Reference Value</label>
                        <div class="col-sm-4">
                            <input type="number" class="form-control" name="value_reference">
                        </div>
                    </div>
                </div>
                <input type="hidden" name="tab" value="table">
                <input type="hidden" name="action" value="add">
                <input type="hidden" name="formulaId" value="{{ formulaId }}">
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<form class="form-horizontal" method="POST" action="/calibration/sample">
    <input type="hidden" name="tab" value="check">
    <div class="form-group row">
        <div class="col-sm-4">
            <select name="groupSensorId" class="form-control" required>
                <option value="">--- Choose Sample Sensor ---</option>
                {% for i in range(groupSensorData|length) %}
                <option value="{{ groupSensorData[i]['id']}}" {% if
                    groupSensorData[i]['id']|string==groupSensorId|string %} {{ "selected" }} {% endif %}>{{
                    groupSensorData[i]['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary float-right">Run</button>
    </div>
</form>
<font style="color:red">Note : Based on Group Sensor</font>
<hr>
<b>Result</b>
<br>
{% if result['state'] == '1' %}
{% for x in output['output'] %}
{{ x  }}<br>
{% endfor %}
<a href="" data-toggle="modal" data-target="#modal-sample" role="button">
    <button type="submit" class="btn btn-primary">Add Sample Sensor</button>
</a>
{% else %}
- <br>
{% endif %}

<hr>
<a href="/calibration/sample?tab=check" role="button">
    <button type="button" class="btn btn-default">
        <i class="fas fa-sync" title="Refresh"></i> Refresh
    </button>
</a>
{% endblock %}
