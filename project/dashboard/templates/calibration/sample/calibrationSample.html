{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
    <div class="col-md-12">
        <div class="card card-dark">
            <div class="card-header">
                <h3 class="card-title">Calibration Sample</h3>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" id="custom-content-below-tab" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link {% if tab == 'check' %}{{ 'active' }}{% endif %}"
                            id="custom-content-below-input-tab" data-toggle="pill" href="#custom-content-below-input"
                            role="tab" aria-controls="custom-content-below-input" aria-selected="true">Check</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if tab == 'table' %}{{ 'active' }}{% endif %}"
                            id="custom-content-below-output-tab" data-toggle="pill" href="#custom-content-below-output"
                            role="tab" aria-controls="custom-content-below-output" aria-selected="true">Table</a>
                    </li>
                </ul>
                <div class="tab-content" id="custom-content-below-tabContent">
                    <div class="tab-pane fade {% if tab == 'check' %}{{ 'show active' }}{% endif %}"
                        id="custom-content-below-input" role="tabpanel"
                        aria-labelledby="custom-content-below-input-tab">
                        <br>
                        {% include "calibration/sample/tabCheck.html" %}                        
                    </div>

                    <div class="tab-pane fade {% if tab == 'table' %}{{ 'show active' }}{% endif %}"
                        id="custom-content-below-output" role="tabpanel"
                        aria-labelledby="custom-content-below-output-tab">
                        <br>
                        {% include "calibration/sample/tabTable.html" %} 
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block toast %}
{% if result['state'] != '' %}
<script>
    $(function () {
        var Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 5000
        });
        Toast.fire({
            icon: "{% if result['state'] == '0' %}{{ 'error' }}{% elif result['state'] == '1' %}{{ 'success' }}{% elif result['state'] == '2' %}{{ 'warning' }}{% endif %}",
            title: "&nbsp;&nbsp;{{ result['message'] }}"
        })
    });
</script>
{% endif %}
{% endblock %}
