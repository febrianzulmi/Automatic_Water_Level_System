{% extends "base.html" %} {% block content %}

<div class="row justify-content-center">
	<div class="col-md-12">
		<div class="card card-dark card-tabs">
			<div class="card-header p-0 pt-1">
				<ul class="nav nav-tabs" id="custom-tabs-one-tab" role="tablist">
					<li class="nav-item">
						<a class="nav-link {% if 'http' in tab %}{{ 'active' }}{% endif %}"
							id="custom-tabs-one-http-tab" data-toggle="pill" href="#custom-tabs-one-http" role="tab"
							aria-controls="custom-tabs-one-http" aria-selected="true">HTTP</a>
					</li>
					<li class="nav-item">
						<a class="nav-link {% if 'mqtt' in tab %}{{ 'active' }}{% endif %}"
							id="custom-tabs-one-mqtt-tab" data-toggle="pill" href="#custom-tabs-one-mqtt" role="tab"
							aria-controls="custom-tabs-one-mqtt" aria-selected="true">MQTT</a>
					</li>
				</ul>
			</div>
			<div class="card-body">
				<div class="tab-content" id="custom-tabs-one-tabContent">
					{% include "setting/server/http.html" %}
					
					{% include "setting/server/mqtt.html" %}
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block toast %}
{% if result['state'] != '' %}
<script>
	$(function () {
		var Toast = Swal.mixin({
			toast: true,
			position: 'top-end',
			showConfirmButton: false,
			timer: 5000
		});
		Toast.fire({
			icon: "{% if result['state'] == '0' %}{{ 'error' }}{% elif result['state'] == '1' %}{{ 'success' }}{% endif %}",
			title: "&nbsp;&nbsp;{{ result['message'] }}"
		})
	});
</script>
{% endif %}
{% endblock %}
