{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
	<div class="col-md-12">
		<div class="card card-info">
			<div class="card-header">
				<h3 class="card-title">Device Identity Form</h3>
			</div>
			<form class="form-horizontal" method="POST" action="/identity_post">
				<div class="card-body">
					<div class="form-group row">
						<label for="inputPassword3" class="col-sm-2 col-form-label">Hostname</label>
						<div class="col-sm-10">
							<input type="text" class="form-control" name="hostname" value="{{ hostname }}"></div>
					</div>
					<div class="form-group row">
						<label for="inputPassword3" class="col-sm-2 col-form-label">Password</label>
						<div class="col-sm-10">
							<input type="password" class="form-control" name="password" value="{{ password }}"></div>
					</div>
				</div>
				<div class="card-footer">
					<button type="submit" class="btn btn-info float-right">Submit</button>
				</div>
				<!-- /.card-footer -->
			</form>
		</div>
	</div>
</div>
 {% endblock %}
