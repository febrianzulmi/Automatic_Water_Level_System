{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
	<div class="col-md-12">
		<div class="card card-dark">
			<div class="card-header">
				<h3 class="card-title">Sensor Check</h3>
			</div>
			<div class="card-body">
				  <form class="form-horizontal" method="POST" action="/check/sensor">
					<div class="form-group row">
						<div class="col-sm-4">
							<select name="sensor" class="form-control" required>
								<option value="">--- Choose Sensor ---</option>
								{% for i in range(sensors|length) %}
								<option value="{{ sensors[i][0]}}" {% if sensors[i][0]|string == sensor_id|string %} {{ "selected" }} {% endif %}>{{ sensors[i][1] }}</option>
								{% endfor %}
							</select>
						</div>	
						<button type="submit" class="btn btn-dark float-right">Run</button> 
					</div> 
					</form>
					<b>Result</b> <br>
					{% for i in range(result|length) %}
             {{ result[i] }}
          <br>
          {% endfor %}
			</div>
			<div class="card-footer"><font style="color:red">Note : Based on Group Sensor</font></div>
		</div>
	</div>
</div>
{% endblock %}
